name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation, not just the solution you have in mind.
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This would need a new runtime dependency
        - label: This changes extraction output (unit/segment counts)
        - label: This adds or changes a review heuristic
